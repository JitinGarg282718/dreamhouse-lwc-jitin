<template>
    <lightning-card title="Account Territory Map" icon-name="standard:location">
        <div slot="actions">
            <lightning-button-icon
                icon-name="utility:refresh"
                variant="border-filled"
                alternative-text="Refresh"
                title="Refresh Map Data"
                onclick={handleRefresh}
                disabled={isLoading}
            ></lightning-button-icon>
        </div>

        <!-- Filters Section -->
        <template lwc:if={showFilters}>
            <div class="slds-card__body slds-card__body_inner">
                <div class="slds-grid slds-wrap slds-gutters">
                    <!-- Search Input -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                        <lightning-input
                            type="search"
                            label="Search Accounts"
                            value={searchKey}
                            onchange={handleSearchChange}
                            placeholder="Search by name, city, or industry..."
                        ></lightning-input>
                    </div>

                    <!-- Territory Filter -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                        <lightning-dual-listbox
                            label="Filter by Territories"
                            options={territoryOptions}
                            value={selectedTerritories}
                            onchange={handleTerritoryChange}
                            size="5"
                        ></lightning-dual-listbox>
                    </div>

                    <!-- Country Filter -->
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                        <lightning-dual-listbox
                            label="Filter by Countries"
                            options={countryOptions}
                            value={selectedCountries}
                            onchange={handleCountryChange}
                            size="5"
                        ></lightning-dual-listbox>
                    </div>
                </div>

                <!-- Display Options -->
                <div class="slds-grid slds-wrap slds-gutters slds-m-top_medium">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                        <lightning-input
                            type="checkbox"
                            label="Show Territory Boundaries"
                            checked={showTerritoryBoundaries}
                            onchange={handleToggleBoundaries}
                        ></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                        <lightning-input
                            type="checkbox"
                            label="Cluster Account Markers"
                            checked={showAccountClusters}
                            onchange={handleToggleClusters}
                        ></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                        <lightning-input
                            type="checkbox"
                            label="Include China Accounts"
                            checked={includeChina}
                            onchange={handleToggleChina}
                        ></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                        <div class="slds-text-color_weak slds-m-top_small">
                            {totalAccountsText}
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- Map Container -->
        <div class="slds-card__body slds-card__body_inner">
            <template lwc:if={isLoading}>
                <div class="slds-align_absolute-center slds-p-around_large">
                    <lightning-spinner alternative-text="Loading map data..." size="medium"></lightning-spinner>
                </div>
            </template>

            <template lwc:else>
                <template lwc:if={error}>
                    <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error">
                        <span class="slds-assistive-text">Error</span>
                        <h2>
                            <lightning-icon icon-name="utility:error" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            Error loading map data: {error.body.message}
                        </h2>
                    </div>
                </template>

                <template lwc:else>
                    <div class="map-container" style={mapContainerStyle}></div>
                </template>
            </template>
        </div>

        <!-- Map Legend -->
        <template lwc:if={territoriesWithStyle}>
            <div class="slds-card__footer">
                <div class="slds-text-heading_small slds-m-bottom_x-small">Territory Legend:</div>
                <div class="slds-grid slds-wrap">
                    <template for:each={territoriesWithStyle} for:item="territory">
                        <div key={territory.id} class="slds-col slds-m-right_medium slds-m-bottom_x-small">
                            <span 
                                class="territory-color-indicator" 
                                style={territory.colorStyle}
                            ></span>
                            <span class="slds-m-left_x-small">{territory.name} ({territory.accountCount})</span>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
